# =============================================================
#  FoolioBridge - мост между донат-сайтом и сервером Minecraft
#  Документация: README.md и PROTOCOL.md в репозитории
# =============================================================

site:
  # Адрес API на вашем сайте (один URL на всё)
  endpoint: "https://example.com/api/foolio"
  # Общий секрет: тот же самый должен стоять на сайте. Минимум 16 символов,
  # лучше 32+ случайных. Никому не показывайте.
  secret: "CHANGE-ME-to-a-long-random-string"
  # Имя этого сервера. Сайт по нему решает, какие заказы сюда отдавать
  # (удобно, если у вас сеть из нескольких серверов).
  server-id: "survival"
  timeout-seconds: 10

polling:
  # Как часто спрашивать сайт о новых заказах (секунды, минимум 3)
  interval-seconds: 10

delivery:
  # Через сколько тиков после входа игрока выдавать ему отложенные заказы (20 тиков = 1 сек)
  join-delay-ticks: 40

security:
  # Белый список команд, которые сайт может выполнять (первое слово команды).
  # Пустой список = разрешены любые. Рекомендуется заполнить, например:
  # allowed-commands: [lp, give, cmi, crates, eco]
  allowed-commands: []
  # Какие ники считаются допустимыми. Для Bedrock-игроков (Geyser) добавьте точку:
  # "^[.A-Za-z0-9_]{1,17}$"
  player-name-pattern: "^[A-Za-z0-9_]{1,16}$"

history:
  # Сколько последних покупок показывать в /donate
  donate-limit: 10

messages:
  # {title} - название товара, {order} - номер заказа, {player} - ник
  delivered: "&a&lСпасибо за покупку! &fВы получили: &e{title}"
  donate-link: "&6Магазин сервера: &e&nhttps://example.com"
  history-header: "&6Ваши последние покупки:"
  # {date}, {title}, {order}, {status}
  history-line: "&7{date} &f{title} &8#{order} {status}"
  history-empty: "&7У вас пока нет покупок."
  no-permission: "&cНедостаточно прав."
  reloaded: "&aFoolioBridge перезагружен."
