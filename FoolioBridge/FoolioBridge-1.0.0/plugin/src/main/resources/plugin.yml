name: FoolioBridge
version: '${version}'
main: dev.foolio.bridge.FoolioBridgePlugin
api-version: '1.20'
description: Free open-source bridge between your donate website and your Minecraft server
authors: [DeJIoVoy]
website: https://github.com/MeMNiK/FoolioBridge
commands:
  donate:
    description: Donate link and your purchase history
    aliases: [donations]
    permission: foolio.donate
  foolio:
    description: FoolioBridge admin command
    usage: /foolio <status|poll|reload>
    permission: foolio.admin
permissions:
  foolio.donate:
    default: true
  foolio.admin:
    default: op
