name: Build plugins
on:
  push:
    paths-ignore: ['**/*.jar', '**/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'
      - name: Build every plugin version folder and put the jar next to it
        run: |
          for dir in $(find . -name build.gradle.kts -path '*/plugin/*' -not -path './.git/*' | xargs -n1 dirname); do
            echo "::group::$dir"
            (cd "$dir" && gradle build --no-daemon) || exit 1
            cp "$dir"/build/libs/*.jar "$dir/.."/
            echo "::endgroup::"
          done
      - name: Commit built jars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f '*.jar'
          if git diff --cached --quiet; then echo "no jar changes"; exit 0; fi
          git commit -m "Build jars [skip ci]"
          git push
