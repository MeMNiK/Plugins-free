name: FoolioTitles E2E
on:
  push:
    branches: ['e2e/foolio-titles']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.4', '1.21.1']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.10' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Build plugin
        run: cd FoolioTitles/FoolioTitles-1.0.0/plugin && gradle build --no-daemon -q && ls build/libs
      - name: Install bots
        run: cd ci/foolio-titles-e2e && npm install --no-audit --no-fund
      - name: Run simulation
        timeout-minutes: 15
        run: cd ci/foolio-titles-e2e && ./run.sh ${{ matrix.mc }} "$GITHUB_WORKSPACE/FoolioTitles/FoolioTitles-1.0.0/plugin/build/libs/FoolioTitles-1.0.0.jar" 2>&1 | tee e2e-output.txt; exit ${PIPESTATUS[0]}
      - name: Publish results to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ci/foolio-titles-e2e
          V=${{ matrix.mc }}
          if [ -f server/server.log ]; then sed 's/\x1b\[[0-9;]*m//g' server/server.log | tail -500 > server-$V.log; fi
          grep -E "ИТОГО" e2e-output.txt | sed 's/^/::notice::/' || true
          grep -E "^FAIL: " e2e-output.txt | head -10 | cut -c1-900 | sed 's/^/::warning::/' || true
          grep -E "dev\.foolio|\[FoolioTitles\].*(ERROR|WARN|Exception)|Exception" server-$V.log 2>/dev/null | head -8 | cut -c1-900 | sed 's/^/::error::/' || true
          for f in e2e-output.txt results-$V.json server-$V.log; do
            [ -f "$f" ] || continue
            name="$f"; [ "$f" = e2e-output.txt ] && name="output-$V.txt"
            path="ci/foolio-titles-e2e/out/$name"
            sha=$(gh api "repos/${{ github.repository }}/contents/$path?ref=e2e/foolio-titles" -q .sha 2>/dev/null || true)
            for i in 1 2 3 4 5; do
              if gh api -X PUT "repos/${{ github.repository }}/contents/$path" \
                  -f message="E2E $V: $name [skip ci]" -f branch=e2e/foolio-titles \
                  -f content="$(base64 -w0 "$f")" ${sha:+-f sha=$sha} >/dev/null; then echo "uploaded $path"; break; fi
              sleep $((i*3)); sha=$(gh api "repos/${{ github.repository }}/contents/$path?ref=e2e/foolio-titles" -q .sha 2>/dev/null || true)
            done
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.mc }}
          path: |
            ci/foolio-titles-e2e/server/server.log
            ci/foolio-titles-e2e/results-*.json
