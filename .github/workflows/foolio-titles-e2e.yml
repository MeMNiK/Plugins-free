name: FoolioTitles E2E
on:
  push:
    branches: ['e2e/foolio-titles']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20.4', '1.21.1']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.10' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Build plugin
        run: cd FoolioTitles/FoolioTitles-1.0.0/plugin && gradle build --no-daemon -q && ls build/libs
      - name: Install bots
        run: cd ci/foolio-titles-e2e && npm install --no-audit --no-fund
      - name: Run simulation
        run: cd ci/foolio-titles-e2e && ./run.sh ${{ matrix.mc }} "$GITHUB_WORKSPACE/FoolioTitles/FoolioTitles-1.0.0/plugin/build/libs/FoolioTitles-1.0.0.jar"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.mc }}
          path: |
            ci/foolio-titles-e2e/server/server.log
            ci/foolio-titles-e2e/results-*.json
